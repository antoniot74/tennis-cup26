<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tennis Cup Pro - Gestione Tornei</title>
    <!-- PWA Meta Tags & Fullscreen Support (Android & iOS) -->
    <meta name="theme-color" content="#0369a1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tennis Cup Pro">
    <link id="pwa-manifest" rel="manifest">
    <link id="apple-touch-icon" rel="apple-touch-icon">
    <link id="favicon-link" rel="icon" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        tennis: {
                            50: 'var(--tennis-50, #f0f9ff)',
                            100: 'var(--tennis-100, #e0f2fe)',
                            200: 'var(--tennis-200, #bae6fd)',
                            400: 'var(--tennis-400, #38bdf8)',
                            500: 'var(--tennis-500, #0ea5e9)',
                            600: 'var(--tennis-600, #0284c7)',
                            700: 'var(--tennis-700, #0369a1)',
                            800: 'var(--tennis-800, #075985)',
                            900: 'var(--tennis-900, #0c4a6e)',
                        },
                        clay: {
                            500: '#d97706',
                            600: '#b45309',
                            700: '#92400e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --tennis-50: #f0f9ff;
            --tennis-100: #e0f2fe;
            --tennis-200: #bae6fd;
            --tennis-400: #38bdf8;
            --tennis-500: #0ea5e9;
            --tennis-600: #0284c7;
            --tennis-700: #0369a1;
            --tennis-800: #075985;
            --tennis-900: #0c4a6e;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            overscroll-behavior: none;
        }
        html {
            overflow: hidden;
            height: 100%;
            width: 100%;
        }
        /* Mobile Frame Styling for Desktop View */
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100%;
            background-color: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        @media (min-width: 640px) {
            body {
                background-color: #0f172a;
                padding: 1.5rem 0;
            }
            .mobile-container {
                height: calc(100vh - 3rem);
                border-radius: 1.75rem;
                overflow: hidden;
            }
        }
        /* Hide scrollbars for clean mobile feel */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Anti-Badge Injector Safety Rules */
        iframe[id*="netlify"], div[id*="netlify-badge"], a[href*="netlify.com/support"], .netlify-badge {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -9999 !important;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-tennis-200 selection:text-tennis-900">

    <div class="mobile-container">
        
        <!-- Top App Header -->
        <header class="bg-gradient-to-r from-tennis-900 via-tennis-800 to-tennis-700 text-white px-4 py-3.5 shadow-md sticky top-0 z-30">
            <div class="flex justify-between items-center gap-2">
                <div class="flex items-center space-x-2.5 min-w-0">
                    <!-- Dynamic App Logo Container -->
                    <div id="header-app-logo" class="w-10 h-10 rounded-full bg-gradient-to-br from-lime-400 via-emerald-500 to-sky-600 border-2 border-white/80 shadow-md flex items-center justify-center shrink-0 relative overflow-hidden">
                        <!-- Default / Custom Logo rendered via JS -->
                    </div>
                    <div class="min-w-0">
                        <h1 id="app-title" class="font-extrabold text-sm tracking-tight leading-tight truncate">Open Tennis Cup 2026</h1>
                        <div class="flex items-center space-x-1.5 mt-0.5">
                            <span id="role-dot" class="w-2 h-2 rounded-full bg-blue-300 shrink-0"></span>
                            <span id="user-role-badge" class="text-[11px] font-medium text-tennis-100 truncate">Visualizzatore</span>
                        </div>
                    </div>
                </div>

                <!-- Header Action Buttons -->
                <div class="flex items-center space-x-1.5 shrink-0">
                    <!-- PWA Install Button (shown when installable) -->
                    <button id="pwa-install-banner" onclick="triggerPwaInstall()" class="hidden bg-amber-400 hover:bg-amber-300 text-slate-900 text-[11px] font-extrabold px-2.5 py-1.5 rounded-xl shadow transition flex items-center space-x-1">
                        <i class="fa-solid fa-download"></i>
                        <span>Installa</span>
                    </button>

                    <!-- Save Button (Only Editore / Amministratore) -->
                    <button id="header-save-btn" onclick="saveAllChangesManual()" class="hidden bg-tennis-500 hover:bg-tennis-400 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-xl shadow transition flex items-center space-x-1" title="Salva modifiche">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Salva</span>
                    </button>

                    <!-- Logout Button (Only Editore / Amministratore) -->
                    <button id="header-logout-btn" onclick="logoutRole()" class="hidden bg-rose-500/90 hover:bg-rose-600 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-xl shadow transition flex items-center space-x-1" title="Esci dal ruolo">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Esci</span>
                    </button>

                    <!-- Cloud Sync Status Indicator (Shown when connected to shared database) -->
                    <button id="header-sync-badge" onclick="manualCloudPull()" class="hidden bg-emerald-400/20 border border-emerald-300/40 text-emerald-100 text-[10px] font-bold px-2 py-1 rounded-xl flex items-center space-x-1" title="Sincronizzato online - Tocca per aggiornare">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span>
                        <span>LIVE</span>
                    </button>

                    <!-- Secret Tap Trigger Area & Hidden Role / Login Switcher Button -->
                    <div id="secret-login-zone" onclick="handleSecretLoginTap()" class="relative min-w-[78px] min-h-[34px] flex items-center justify-end cursor-pointer select-none rounded-xl">
                        <button id="header-login-btn" onclick="event.stopPropagation(); openLoginModal()" class="hidden bg-white/15 hover:bg-white/25 backdrop-blur-xs text-white text-[11px] font-bold px-3 py-1.5 rounded-xl border border-white/20 transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-user-lock text-tennis-200"></i>
                            <span>Accedi</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area with Dynamic Tabs -->
        <main id="main-content" class="flex-1 overflow-y-auto overscroll-y-contain pb-24 p-4 hide-scrollbar bg-slate-50 relative" style="-webkit-overflow-scrolling: touch;">
            <!-- Dynamic Views injected via JavaScript -->
        </main>

        <!-- Pull-to-Refresh Floating Indicator -->
        <div id="ptr-indicator" class="fixed top-16 left-1/2 -translate-x-1/2 z-40 pointer-events-none opacity-0 transition-opacity duration-200 flex items-center justify-center">
            <div class="bg-white border border-slate-200 shadow-lg rounded-full w-10 h-10 flex items-center justify-center text-tennis-600">
                <i id="ptr-icon" class="fa-solid fa-arrow-down text-sm transition-transform duration-150"></i>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="fixed sm:absolute bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-slate-200 px-1 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] flex justify-around items-center z-30 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <button onclick="switchTab('gironi')" id="nav-gironi" class="flex flex-col items-center text-slate-500 hover:text-tennis-600 transition flex-1 py-1">
                <i class="fa-solid fa-ranking-star text-base"></i>
                <span class="text-[10px] font-semibold mt-1">Gironi</span>
            </button>
            <button onclick="switchTab('calendario')" id="nav-calendario" class="flex flex-col items-center text-slate-500 hover:text-tennis-600 transition flex-1 py-1">
                <i class="fa-solid fa-calendar-check text-base"></i>
                <span class="text-[10px] font-semibold mt-1">Partite</span>
            </button>
            <button onclick="switchTab('fasefinale')" id="nav-fasefinale" class="flex flex-col items-center text-slate-500 hover:text-tennis-600 transition flex-1 py-1">
                <i class="fa-solid fa-trophy text-base"></i>
                <span class="text-[10px] font-semibold mt-1">Tabellone</span>
            </button>
            <button onclick="switchTab('regolamento')" id="nav-regolamento" class="flex flex-col items-center text-slate-500 hover:text-tennis-600 transition flex-1 py-1">
                <i class="fa-solid fa-scale-balanced text-base"></i>
                <span class="text-[10px] font-semibold mt-1">Regole</span>
            </button>
            <button id="nav-admin-tab" onclick="switchTab('admin')" class="hidden flex flex-col items-center text-slate-500 hover:text-tennis-600 transition flex-1 py-1">
                <i class="fa-solid fa-sliders text-base"></i>
                <span class="text-[10px] font-semibold mt-1">Admin</span>
            </button>
        </nav>

        <!-- Notification Toast -->
        <div id="toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-semibold opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2 max-w-[90%]">
            <i id="toast-icon" class="fa-solid fa-circle-check text-tennis-400"></i>
            <span id="toast-msg">Messaggio notifica</span>
        </div>

        <!-- Login & Role Selection Modal with Password Protection -->
        <div id="login-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform transition-all border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-extrabold text-slate-800 flex items-center space-x-2">
                        <i class="fa-solid fa-shield-halved text-tennis-600"></i>
                        <span>Accesso & Ruoli</span>
                    </h3>
                    <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600 bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <p class="text-xs text-slate-500 mb-4 leading-relaxed">Seleziona la modalità di accesso. I ruoli <strong>Editore</strong> e <strong>Amministratore</strong> richiedono password.</p>
                
                <!-- Role Selection Buttons -->
                <div id="role-selection-list" class="space-y-2.5">
                    <button onclick="selectRoleForLogin('visualizzatore')" class="w-full text-left p-3.5 rounded-2xl border border-slate-200 hover:border-tennis-500 hover:bg-tennis-50/70 transition flex items-center justify-between group">
                        <div class="flex items-center space-x-3">
                            <div class="bg-blue-100 text-blue-700 w-9 h-9 rounded-xl flex items-center justify-center">
                                <i class="fa-solid fa-eye"></i>
                            </div>
                            <div>
                                <div class="font-bold text-sm text-slate-800">Visualizzatore</div>
                                <div class="text-[11px] text-slate-500">Accesso libero • Consulta gironi e risultati</div>
                            </div>
                        </div>
                        <span class="text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-1 rounded-lg">Libero</span>
                    </button>

                    <button onclick="selectRoleForLogin('editore')" class="w-full text-left p-3.5 rounded-2xl border border-slate-200 hover:border-amber-500 hover:bg-amber-50/60 transition flex items-center justify-between group">
                        <div class="flex items-center space-x-3">
                            <div class="bg-amber-100 text-amber-700 w-9 h-9 rounded-xl flex items-center justify-center">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </div>
                            <div>
                                <div class="font-bold text-sm text-slate-800">Editore</div>
                                <div class="text-[11px] text-slate-500">Inserimento risultati e date partite</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-lock text-xs text-amber-600"></i>
                    </button>

                    <button onclick="selectRoleForLogin('amministratore')" class="w-full text-left p-3.5 rounded-2xl border border-slate-200 hover:border-tennis-600 hover:bg-tennis-50/70 transition flex items-center justify-between group">
                        <div class="flex items-center space-x-3">
                            <div class="bg-tennis-100 text-tennis-700 w-9 h-9 rounded-xl flex items-center justify-center">
                                <i class="fa-solid fa-user-shield"></i>
                            </div>
                            <div>
                                <div class="font-bold text-sm text-slate-800">Amministratore</div>
                                <div class="text-[11px] text-slate-500">Gestione completa torneo, gironi e password</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-lock text-xs text-tennis-600"></i>
                    </button>
                </div>

                <!-- Password Verification Step (Hidden initially) -->
                <div id="password-verification-box" class="hidden space-y-4 pt-1">
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between">
                        <div class="flex items-center space-x-2.5">
                            <i id="selected-role-icon" class="fa-solid fa-lock text-tennis-600"></i>
                            <div>
                                <div class="text-[10px] uppercase font-bold text-slate-400">Ruolo selezionato</div>
                                <div id="selected-role-label" class="text-sm font-extrabold text-slate-800 capitalize">Editore</div>
                            </div>
                        </div>
                        <button type="button" onclick="resetLoginModalView()" class="text-xs text-tennis-700 font-semibold hover:underline">Cambia</button>
                    </div>

                    <form onsubmit="verifyRolePassword(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Inserisci Password</label>
                            <div class="relative">
                                <input type="password" id="role-password-input" class="w-full text-sm p-3 pr-10 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-tennis-500" placeholder="••••••••" required>
                                <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                    <i id="pwd-eye-icon" class="fa-solid fa-eye text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <div id="login-error-msg" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold p-2.5 rounded-xl flex items-center space-x-2">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            <span>Password errata. Riprova.</span>
                        </div>

                        <button type="submit" class="w-full bg-tennis-600 hover:bg-tennis-700 text-white font-bold text-xs py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span>Conferma e Accedi</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Result & Date Editor Modal (For Group & Knockout Matches) -->
        <div id="match-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-extrabold text-slate-800 flex items-center space-x-2">
                        <i class="fa-solid fa-tennis-ball text-tennis-600"></i>
                        <span id="match-modal-title">Dettagli & Risultato Incontro</span>
                    </h3>
                    <button onclick="closeMatchModal()" class="text-slate-400 hover:text-slate-600 bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <form id="match-form" onsubmit="saveMatchResult(event)" class="space-y-4">
                    <input type="hidden" id="match-id">
                    <input type="hidden" id="match-stage-type" value="group">
                    
                    <div class="bg-gradient-to-r from-slate-50 to-slate-100 p-3.5 rounded-2xl border border-slate-200 text-xs flex justify-between items-center">
                        <span id="modal-player1" class="font-extrabold text-slate-800 flex-1 text-right pr-2 truncate">Giocatore 1</span>
                        <span class="bg-tennis-600 text-white font-bold px-2 py-0.5 rounded-md text-[10px]">VS</span>
                        <span id="modal-player2" class="font-extrabold text-slate-800 flex-1 text-left pl-2 truncate">Giocatore 2</span>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-700 mb-1">Data Incontro</label>
                            <input type="date" id="match-date" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-tennis-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-700 mb-1">Orario</label>
                            <input type="time" id="match-time" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-tennis-500">
                        </div>
                    </div>

                    <div class="flex justify-end -mt-2">
                        <button type="button" onclick="clearMatchSchedule()" class="text-[11px] font-bold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-2.5 py-1 rounded-lg transition flex items-center space-x-1">
                            <i class="fa-solid fa-calendar-xmark"></i>
                            <span>Azzera Data e Ora</span>
                        </button>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">Punteggio Completo (es. 6-4 3-6 10-7)</label>
                        <input type="text" id="match-score-string" placeholder="6-4 6-3" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-tennis-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label id="label-p1-sets" class="block text-[11px] font-bold text-slate-700 mb-1 truncate">Set Giocatore 1</label>
                            <input type="number" id="match-p1-sets" min="0" max="3" value="0" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-tennis-500">
                        </div>
                        <div>
                            <label id="label-p2-sets" class="block text-[11px] font-bold text-slate-700 mb-1 truncate">Set Giocatore 2</label>
                            <input type="number" id="match-p2-sets" min="0" max="3" value="0" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-tennis-500">
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <input type="checkbox" id="match-played" class="w-4 h-4 text-tennis-600 rounded focus:ring-tennis-500">
                        <label for="match-played" class="text-xs font-bold text-slate-700">Partita conclusa (aggiorna classifica)</label>
                    </div>

                    <div class="grid grid-cols-3 gap-2 pt-1">
                        <button type="button" onclick="resetSingleMatch()" class="col-span-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold text-xs py-3 rounded-xl transition flex items-center justify-center space-x-1" title="Resetta completamente l'incontro">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>Reset</span>
                        </button>
                        <button type="submit" class="col-span-2 bg-tennis-600 hover:bg-tennis-700 text-white font-bold text-xs py-3 rounded-xl shadow-md transition">
                            Salva Risultato
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Preset SVG Logos (Encoded Data URIs)
        const PRESET_LOGOS = {
            rackets: "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#84cc16"/><stop offset="50%" stop-color="#10b981"/><stop offset="100%" stop-color="#0284c7"/></linearGradient></defs><circle cx="100" cy="100" r="100" fill="url(#bg)"/><g stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"><ellipse cx="75" cy="75" rx="28" ry="38" transform="rotate(-45 75 75)"/><line x1="95" y1="95" x2="145" y2="145" stroke-width="10"/><ellipse cx="125" cy="75" rx="28" ry="38" transform="rotate(45 125 75)"/><line x1="105" y1="95" x2="55" y2="145" stroke-width="10"/></g><circle cx="100" cy="105" r="18" fill="#d9f99d" stroke="#ffffff" stroke-width="3"/></svg>`),
            trophy: "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient></defs><circle cx="100" cy="100" r="100" fill="url(#bg2)"/><path d="M65 55h70v35c0 22-15 38-35 38s-35-16-35-38V55z" fill="#fbbf24"/><path d="M65 68H48c0 20 10 30 22 32M135 68h17c0 20-10 30-22 32" stroke="#fbbf24" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="92" y="125" width="16" height="24" fill="#fbbf24"/><rect x="72" y="148" width="56" height="10" rx="5" fill="#f59e0b"/><circle cx="132" cy="72" r="16" fill="#bef264" stroke="#ffffff" stroke-width="2.5"/></svg>`)
        };

        // Preset Theme Palettes
        const THEME_PALETTES = {
            sky: {
                name: 'Celeste (Predefinito)',
                50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7',
                700: '#0369a1', 800: '#075985', 900: '#0c4a6e'
            },

        // Calculate Group Standings dynamically from players and matches
        function calculateGroupStandings(groupLetter) {
            const groupPlayers = appState.players.filter(p => p.group === groupLetter);
            const stats = {};

            groupPlayers.forEach(p => {
                stats[p.name] = {
                    name: p.name,
                    played: 0,
                    won: 0,
                    lost: 0,
                    setsWon: 0,
                    setsLost: 0,
                    points: 0
                };
            });

            const groupMatches = appState.matches.filter(m => m.group === groupLetter && m.played);

            groupMatches.forEach(m => {
                const p1 = stats[m.player1];
                const p2 = stats[m.player2];
                if (!p1 || !p2) return;

                p1.played++;
                p2.played++;

                p1.setsWon += (m.p1Sets || 0);
                p1.setsLost += (m.p2Sets || 0);
                p2.setsWon += (m.p2Sets || 0);
                p2.setsLost += (m.p1Sets || 0);

                if (m.p1Sets > m.p2Sets) {
                    p1.won++;
                    p2.lost++;
                    p1.points += 3;
                } else if (m.p2Sets > m.p1Sets) {
                    p2.won++;
                    p1.lost++;
                    p2.points += 3;
                }
            });

            return Object.values(stats).sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                const diffA = a.setsWon - a.setsLost;
                const diffB = b.setsWon - b.setsLost;
                if (diffB !== diffA) return diffB - diffA;
                return b.won - a.won;
            });
        }

                if (dbParam && dbParam.startsWith('http')) {

        function getNormalizedCloudEndpoint(rawUrl) {
            if (!rawUrl) return '';
            let clean = rawUrl.trim().replace(/\/+$/, '');
            if (!clean.endsWith('.json')) {
                clean += '/tennis_cup_pro_data.json';
            }
            return clean;

        // Push current tournament state to Cloud (Only when Editore or Amministratore saves changes)
        async function pushStateToCloud() {
            const endpoint = getNormalizedCloudEndpoint(appState.cloudSyncUrl);
            if (!endpoint) return;
            if (appState.currentUserRole === 'visualizzatore') return;

            try {
                const payloadToSync = {
                    tournamentName: appState.tournamentName,
                    customLogo: appState.customLogo,
                    themeKey: appState.themeKey,
                    customThemeHex: appState.customThemeHex,
                    passwords: appState.passwords,
                    players: appState.players,
                    matches: appState.matches,
                    playoffs: appState.playoffs,
                    rulesText: appState.rulesText,
                    authorText: appState.authorText,
                    copyrightText: appState.copyrightText,
                    updatedAt: Date.now()
                };
                const res = await fetch(endpoint, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadToSync)
                });
                if (res.ok) {
                    lastCloudHash = JSON.stringify(payloadToSync.matches) + JSON.stringify(payloadToSync.players) + JSON.stringify(payloadToSync.playoffs);
                }
            } catch (e) {
                console.error("Cloud push error:", e);
            }
        }

        // Pull latest tournament state from Cloud (For all smartphones)
        async function pullStateFromCloud(silent = true) {
            const endpoint = getNormalizedCloudEndpoint(appState.cloudSyncUrl);
            if (!endpoint) return;

            try {
                const res = await fetch(endpoint + '?t=' + Date.now());
                if (!res.ok) return;
                const remoteData = await res.json();
                if (!remoteData || !remoteData.players) return;

                const newHash = JSON.stringify(remoteData.matches) + JSON.stringify(remoteData.players) + JSON.stringify(remoteData.playoffs);
                const metaChanged = remoteData.tournamentName !== appState.tournamentName ||
                                    remoteData.themeKey !== appState.themeKey ||
                                    remoteData.rulesText !== appState.rulesText;

                if (newHash !== lastCloudHash || metaChanged) {
                    lastCloudHash = newHash;
                    const preservedRole = appState.currentUserRole;
                    const preservedTab = appState.activeTab;
                    const preservedFilter = appState.viewerSelectedPlayer;
                    const preservedUrl = appState.cloudSyncUrl;

                    appState = Object.assign({}, appState, remoteData, {
                        currentUserRole: preservedRole,
                        activeTab: preservedTab,
                        viewerSelectedPlayer: preservedFilter,
                        cloudSyncUrl: preservedUrl
                    });

                    localStorage.setItem('tennis_cup_pro_state_v2', JSON.stringify(appState));
                    renderApp();
                    if (!silent) showToast('Dati aggiornati dal server!', 'success');
                } else if (!silent) {
                    showToast('Torneo già aggiornato all\'ultima versione.', 'info');
                }
            } catch (e) {
                if (!silent) showToast('Impossibile contattare il server di sincronizzazione.', 'info');
            }
        }

        // Generate a full 50-900 tonal scale from a single hex color
        function buildPaletteFromHex(hex) {
            const cleanHex = hex.replace('#', '');
            const r = parseInt(cleanHex.substring(0, 2), 16) || 2;
            const g = parseInt(cleanHex.substring(2, 4), 16) || 132;
            const b = parseInt(cleanHex.substring(4, 6), 16) || 199;

            const mix = (c, target, weight) => Math.round(c + (target - c) * weight);
            const toHex = (nr, ng, nb) =>
                '#' + [nr, ng, nb].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');

            return {
                50: toHex(mix(r, 255, 0.92), mix(g, 255, 0.92), mix(b, 255, 0.92)),
                100: toHex(mix(r, 255, 0.84), mix(g, 255, 0.84), mix(b, 255, 0.84)),
                200: toHex(mix(r, 255, 0.68), mix(g, 255, 0.68), mix(b, 255, 0.68)),
                400: toHex(mix(r, 255, 0.25), mix(g, 255, 0.25), mix(b, 255, 0.25)),
                500: toHex(mix(r, 255, 0.10), mix(g, 255, 0.10), mix(b, 255, 0.10)),
                600: `#${cleanHex}`,
                700: toHex(mix(r, 0, 0.18), mix(g, 0, 0.18), mix(b, 0, 0.18)),
                800: toHex(mix(r, 0, 0.34), mix(g, 0, 0.34), mix(b, 0, 0.34)),
                900: toHex(mix(r, 0, 0.50), mix(g, 0, 0.50), mix(b, 0, 0.50))
            };
        }

        // Handle Logo File Upload (JPG, PNG, ICO, SVG, WEBP) with automatic resizing for storage safety
        function handleCustomLogoUpload(event) {
            if (appState.currentUserRole !== 'amministratore') {
                showToast('Azione riservata esclusivamente al profilo Amministratore.', 'info');
                return;
            }
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const size = 256; // Optimal crisp icon size for PWA, header & localStorage
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(img, 0, 0, size, size);
                    const resizedDataUrl = canvas.toDataURL('image/png', 0.92);

                    appState.customLogo = resizedDataUrl;
                    saveToStorage();
                    applyAppLogoToAllParts();
                    renderApp();
                    showToast('Nuovo logo applicato su tutta l\'app!', 'success');
                };
                img.onerror = function() {
                    // Fallback directly for .ico or special formats
                    appState.customLogo = e.target.result;
                    saveToStorage();
                    applyAppLogoToAllParts();
                    renderApp();
                    showToast('Nuovo logo applicato su tutta l\'app!', 'success');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveMatchResult(event) {
            event.preventDefault();
            const matchId = document.getElementById('match-id').value;
            const stageType = document.getElementById('match-stage-type').value;
            const date = document.getElementById('match-date').value;
            const time = document.getElementById('match-time').value;
            const scoreText = document.getElementById('match-score-string').value.trim();
            const p1Sets = parseInt(document.getElementById('match-p1-sets').value) || 0;
            const p2Sets = parseInt(document.getElementById('match-p2-sets').value) || 0;
            const played = document.getElementById('match-played').checked;

            if (stageType === 'group') {
                const m = appState.matches.find(item => item.id === matchId);
                if (m) {
                    m.date = date;
                    m.time = time;
                    m.scoreText = scoreText;
                    m.p1Sets = p1Sets;
                    m.p2Sets = p2Sets;
                    m.played = played;
                }
            } else if (stageType === 'quarterfinal') {
                const q = appState.playoffs.quarterfinals.find(item => item.id === matchId);
                if (q) {
                    q.date = date;
                    q.time = time;
                    q.scoreText = scoreText;
                    q.p1Sets = p1Sets;
                    q.p2Sets = p2Sets;
                    q.played = played;
                    if (played) {
                        q.winner = p1Sets > p2Sets ? q.player1 : q.player2;
                    } else {
                        q.winner = '';
                    }
                    updatePlayoffProgression();
                }
            } else if (stageType === 'semifinal') {
                const s = appState.playoffs.semifinals.find(item => item.id === matchId);
                if (s) {
                    s.date = date;
                    s.time = time;
                    s.scoreText = scoreText;
                    s.p1Sets = p1Sets;
                    s.p2Sets = p2Sets;
                    s.played = played;
                    if (played) {
                        s.winner = p1Sets > p2Sets ? s.player1 : s.player2;
                    } else {
                        s.winner = '';
                    }
                    updatePlayoffProgression();
                }
            } else if (stageType === 'final') {
                const f = appState.playoffs.final.find(item => item.id === matchId);
                if (f) {
                    f.date = date;
                    f.time = time;
                    f.scoreText = scoreText;
                    f.p1Sets = p1Sets;
                    f.p2Sets = p2Sets;
                    f.played = played;
                    if (played) {
                        f.winner = p1Sets > p2Sets ? f.player1 : f.player2;
                    } else {
                        f.winner = '';
                    }
                }
            }

            saveToStorage();
            closeMatchModal();
            renderApp();
            showToast('Risultato e incontri aggiornati con successo!', 'success');
        }

        function updatePlayoffProgression() {
            const q = appState.playoffs.quarterfinals;
            const s = appState.playoffs.semifinals;
            const f = appState.playoffs.final;

            if (s[0]) s[0].player1 = q[0].winner || 'Vincente Q1';
            if (s[0]) s[0].player2 = q[1].winner || 'Vincente Q2';
            if (s[1]) s[1].player1 = q[2].winner || 'Vincente Q3';
            if (s[1]) s[1].player2 = q[3].winner || 'Vincente Q4';

            if (f[0]) f[0].player1 = s[0].winner || 'Vincente SF1';
            if (f[0]) f[0].player2 = s[1].winner || 'Vincente SF2';
        }

        function generateQuarterfinalsFromStandings() {
            if (appState.currentUserRole !== 'amministratore') {
                showToast('Funzione riservata all\'Amministratore.', 'info');
                return;
            }

            const groups = [...new Set(appState.players.map(p => p.group))].sort();
            if (groups.length < 2) {
                showToast('Servono almeno 2 gironi per generare i quarti.', 'info');
                return;
            }

            const standingsA = calculateGroupStandings(groups[0]);
            const standingsB = calculateGroupStandings(groups[1] || 'B');

            const p1A = standingsA[0] ? standingsA[0].name : '1° Girone A';
            const p2A = standingsA[1] ? standingsA[1].name : '2° Girone A';
            const p1B = standingsB[0] ? standingsB[0].name : '1° Girone B';
            const p2B = standingsB[1] ? standingsB[1].name : '2° Girone B';

            appState.playoffs.quarterfinals[0].player1 = p1A;
            appState.playoffs.quarterfinals[0].player2 = p2B;

            appState.playoffs.quarterfinals[1].player1 = p1B;
            appState.playoffs.quarterfinals[1].player2 = p2A;

            if (standingsA[2] && standingsB[2]) {
                appState.playoffs.quarterfinals[2].player1 = standingsA[2].name;
                appState.playoffs.quarterfinals[2].player2 = standingsB[3] ? standingsB[3].name : '4° B';
                appState.playoffs.quarterfinals[3].player1 = standingsB[2].name;
                appState.playoffs.quarterfinals[3].player2 = standingsA[3] ? standingsA[3].name : '4° A';
            }

            updatePlayoffProgression();
            saveToStorage();
            renderApp();
            showToast('Quarti di finale generati con successo dalle classifiche!', 'success');
        }

        // Admin Tournament Generator
        function generateNewTournamentStructure(event) {
            event.preventDefault();
            if (appState.currentUserRole !== 'amministratore') return;

            const name = document.getElementById('admin-tournament-name').value;
            const numPlayers = parseInt(document.getElementById('admin-num-players').value);
            const numGroups = parseInt(document.getElementById('admin-num-groups').value);

            appState.tournamentName = name;
            appState.players = [];

            const firstNames = ['Marco', 'Luca', 'Giovanni', 'Alessandro', 'Matteo', 'Davide', 'Simone', 'Federico', 'Andrea', 'Stefano', 'Paolo', 'Lorenzo', 'Francesco', 'Riccardo', 'Gabriele', 'Filippo'];
            const lastNames = ['Rossi', 'Bianchi', 'Verdi', 'Neri', 'Gialli', 'Blu', 'Viola', 'Rosa', 'Ferrari', 'Russo', 'Romano', 'Gallo', 'Costa', 'Fontana', 'Conti', 'Esposito'];

            for (let i = 1; i <= numPlayers; i++) {
                const groupIndex = (i - 1) % numGroups;
                const groupLetter = String.fromCharCode(65 + groupIndex);
                const fName = firstNames[(i - 1) % firstNames.length];
                const lName = lastNames[(i - 1) % lastNames.length];
                appState.players.push({
                    id: i,
                    name: `${fName} ${lName} (${groupLetter}${Math.ceil(i/numGroups)})`,
                    group: groupLetter
                });
            }

            appState.matches = [];
            const groupsMap = {};
            appState.players.forEach(p => {
                if (!groupsMap[p.group]) groupsMap[p.group] = [];
                groupsMap[p.group].push(p.name);
            });

            let matchCounter = 1;
            Object.keys(groupsMap).forEach(gLetter => {
                const gPlayers = groupsMap[gLetter];
                for (let i = 0; i < gPlayers.length; i++) {
                    for (let j = i + 1; j < gPlayers.length; j++) {
                        appState.matches.push({
                            id: `m_${matchCounter++}`,

                ],
                semifinals: [

        function updatePlayerName(playerId, newNameRaw) {
            if (appState.currentUserRole !== 'amministratore') return;
            const newName = newNameRaw.trim();
            if (!newName) {
                showToast('Il nome del giocatore non può essere vuoto.', 'info');
                renderApp();
                return;
            }

            const player = appState.players.find(p => p.id === playerId);
            if (!player || player.name === newName) return;

            const oldName = player.name;
            if (appState.players.some(p => p.id !== playerId && p.name.toLowerCase() === newName.toLowerCase())) {
                showToast('Esiste già un giocatore con questo nome.', 'info');
                renderApp();
                return;
            }

            player.name = newName;

            appState.matches.forEach(m => {
                if (m.player1 === oldName) m.player1 = newName;
                if (m.player2 === oldName) m.player2 = newName;
            });

            ['quarterfinals', 'semifinals', 'final'].forEach(stage => {
                appState.playoffs[stage].forEach(match => {
                    if (match.player1 === oldName) match.player1 = newName;
                    if (match.player2 === oldName) match.player2 = newName;
                    if (match.winner === oldName) match.winner = newName;
                });
            });

            if (appState.viewerSelectedPlayer === oldName) {
                appState.viewerSelectedPlayer = newName;
            }

            saveToStorage();
            renderApp();
            showToast(`Nome aggiornato: "${newName}"`, 'success');
        }

        function addNewPlayerAdmin(event) {
            event.preventDefault();
            if (appState.currentUserRole !== 'amministratore') return;

            const nameInput = document.getElementById('admin-new-player-name');
            const groupSelect = document.getElementById('admin-new-player-group');
            const name = nameInput ? nameInput.value.trim() : '';
            const group = groupSelect ? groupSelect.value : 'A';

            if (!name) return;
            if (appState.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
                showToast('Questo giocatore è già presente nel torneo.', 'info');
                return;
            }

            const existingGroupPlayers = appState.players.filter(p => p.group === group);
            const nextId = appState.players.reduce((max, p) => Math.max(max, p.id), 0) + 1;

            appState.players.push({ id: nextId, name, group });

            existingGroupPlayers.forEach((opponent, idx) => {
                appState.matches.push({
                    id: `m_${Date.now()}_${idx}`,
                    group,
                    player1: opponent.name,
                    player2: name,
                    date: '2026-11-24',
                    time: '18:00',
                    scoreText: '',
                    p1Sets: 0,
                    p2Sets: 0,
                    played: false
                });
            });

            saveToStorage();
            renderApp();
            showToast(`Giocatore "${name}" aggiunto al Girone ${group}!`, 'success');
        }

        // Main App Render Controller
        function renderApp() {
            applyAppTheme();
            applyAppLogoToAllParts();

            const titleEl = document.getElementById('app-title');
            if (titleEl) titleEl.textContent = appState.tournamentName || 'Open Tennis Cup 2026';

            const roleBadge = document.getElementById('user-role-badge');
            const roleDot = document.getElementById('role-dot');
            const saveBtn = document.getElementById('header-save-btn');
            const logoutBtn = document.getElementById('header-logout-btn');
            const syncBadge = document.getElementById('header-sync-badge');
            const loginBtn = document.getElementById('header-login-btn');
            const secretZone = document.getElementById('secret-login-zone');
            const adminNavTab = document.getElementById('nav-admin-tab');

            if (syncBadge) {
                if (appState.cloudSyncUrl) {
                    syncBadge.classList.remove('hidden');
                } else {
                    syncBadge.classList.add('hidden');
                }
            }

            const role = appState.currentUserRole;
            if (role === 'amministratore') {
                if (roleBadge) roleBadge.textContent = 'Amministratore';
                if (roleDot) roleDot.className = 'w-2 h-2 rounded-full bg-amber-300 shrink-0';
                if (saveBtn) saveBtn.classList.remove('hidden');
                if (logoutBtn) logoutBtn.classList.remove('hidden');
                if (loginBtn) loginBtn.classList.add('hidden');
                if (secretZone) secretZone.classList.add('hidden');
                if (adminNavTab) adminNavTab.classList.remove('hidden');
            } else if (role === 'editore') {
                if (roleBadge) roleBadge.textContent = 'Editore';
                if (roleDot) roleDot.className = 'w-2 h-2 rounded-full bg-emerald-300 shrink-0';
                if (saveBtn) saveBtn.classList.remove('hidden');
                if (logoutBtn) logoutBtn.classList.remove('hidden');
                if (loginBtn) loginBtn.classList.add('hidden');
                if (secretZone) secretZone.classList.add('hidden');
                if (adminNavTab) adminNavTab.classList.add('hidden');
                if (appState.activeTab === 'admin') appState.activeTab = 'gironi';
            } else {
                if (roleBadge) roleBadge.textContent = 'Visualizzatore';
                if (roleDot) roleDot.className = 'w-2 h-2 rounded-full bg-blue-300 shrink-0';
                if (saveBtn) saveBtn.classList.add('hidden');
                if (logoutBtn) logoutBtn.classList.add('hidden');
                if (secretZone) secretZone.classList.remove('hidden');
                if (loginBtn) {
                    if (isLoginButtonRevealed) {
                        loginBtn.classList.remove('hidden');
                    } else {
                        loginBtn.classList.add('hidden');
                    }
                }
                if (adminNavTab) adminNavTab.classList.add('hidden');
                if (appState.activeTab === 'admin') appState.activeTab = 'gironi';
            }

        // View 2: Calendario & Risultati Partite
        function renderCalendarioView() {
            const groups = [...new Set(appState.players.map(p => p.group))].sort();
            const canEdit = appState.currentUserRole !== 'visualizzatore';
            const selectedPlayer = appState.viewerSelectedPlayer;

            return `
                <div class="space-y-5">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-extrabold text-slate-800 flex items-center space-x-2">
                            <i class="fa-solid fa-calendar-days text-tennis-600"></i>
                            <span>Calendario Incontri</span>
                        </h2>
                        ${selectedPlayer ? `
                            <button onclick="setViewerPlayerFilter('')" class="text-[11px] font-bold bg-tennis-100 text-tennis-800 px-2.5 py-1 rounded-xl flex items-center space-x-1">
                                <span>Filtro: ${selectedPlayer}</span>
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        ` : ''}
                    </div>

                    ${groups.map(g => {
                        let groupMatches = appState.matches.filter(m => m.group === g);
                        if (selectedPlayer) {
                            groupMatches = groupMatches.filter(m => m.player1 === selectedPlayer || m.player2 === selectedPlayer);
                        }
                        if (groupMatches.length === 0) return '';

                        // Ordina gli incontri: prima "In programma" (ordinati per data/ora), poi "Da definire", infine "Conclusi"
                        groupMatches.sort((a, b) => {
                            const getPriority = (match) => {
                                if (!match.played && ((match.date && match.date.trim()) || (match.time && match.time.trim()))) {
                                    return 1; // In programma (in alto)
                                }
                                if (!match.played) {
                                    return 2; // Da definire
                                }
                                return 3; // Conclusa
                            };

                            const prioA = getPriority(a);
                            const prioB = getPriority(b);

                            if (prioA !== prioB) return prioA - prioB;

                            // Se entrambi sono "In programma", ordina cronologicamente dal più vicino
                            if (prioA === 1) {
                                const dtA = `${a.date || '9999-12-31'} ${a.time || '23:59'}`;
                                const dtB = `${b.date || '9999-12-31'} ${b.time || '23:59'}`;
                                return dtA.localeCompare(dtB);
                            }

                            return 0;
                        });

                        return `
                            <div class="space-y-2.5">
                                <div class="flex items-center space-x-2">
                                    <span class="bg-tennis-700 text-white text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-lg">Girone ${g}</span>
                                    <div class="h-px bg-slate-200 flex-1"></div>
                                </div>

                                ${groupMatches.map(m => {
                                    const p1Win = m.played && m.p1Sets > m.p2Sets;
                                    const p2Win = m.played && m.p2Sets > m.p1Sets;
                                    const isScheduled = !m.played && Boolean((m.date && m.date.trim()) || (m.time && m.time.trim()));

                                    const cardBorderClass = m.played
                                        ? 'bg-white border-slate-200'
                                        : isScheduled
                                            ? 'bg-sky-50/40 border-sky-300'
                                            : 'bg-white border-dashed border-amber-300';

                                    const statusBadgeClass = m.played
                                        ? 'bg-tennis-100 text-tennis-800'
                                        : isScheduled
                                            ? 'bg-sky-100 text-sky-800 border border-sky-200'
                                            : 'bg-amber-50 text-amber-700 border border-amber-200';

                                    const statusLabel = m.played
                                        ? 'Conclusa'
                                        : isScheduled
                                            ? 'In programma'
                                            : 'Da definire';

                                    return `
                                        <div onclick="${canEdit ? `openMatchModal('${m.id}', 'group')` : ''}" class="p-3.5 rounded-2xl border ${cardBorderClass} shadow-xs ${canEdit ? 'cursor-pointer hover:border-tennis-500 active:scale-[0.99]' : ''} transition">
                                            <div class="flex justify-between items-center text-[10px] text-slate-500 font-semibold mb-2">
                                                <span class="flex items-center space-x-1">
                                                    <i class="fa-regular ${isScheduled ? 'fa-calendar-check text-sky-600' : 'fa-clock text-tennis-600'}"></i>
                                                    <span>${m.date || 'Data da definire'} ${m.time ? '• ' + m.time : ''}</span>
                                                </span>
                                                <span class="px-2 py-0.5 rounded-md font-bold ${statusBadgeClass}">
                                                    ${statusLabel}
                                                </span>
                                            </div>
                                            <div class="flex items-center justify-between gap-2">
                                                <div class="flex-1 text-right truncate text-xs ${p1Win ? 'font-extrabold text-tennis-700' : 'font-semibold text-slate-700'}">
                                                    ${p1Win ? '<i class="fa-solid fa-crown text-amber-400 mr-1 text-[10px]"></i>' : ''}${m.player1}
                                                </div>
                                                <div class="px-2.5 py-1 rounded-xl text-xs font-extrabold shrink-0 ${m.played ? 'bg-slate-900 text-white' : isScheduled ? 'bg-sky-100 text-sky-800' : 'bg-slate-100 text-slate-500'}">
                                                    ${m.played ? (m.scoreText || `${m.p1Sets}-${m.p2Sets}`) : 'VS'}
                                                </div>
                                                <div class="flex-1 text-left truncate text-xs ${p2Win ? 'font-extrabold text-tennis-700' : 'font-semibold text-slate-700'}">
                                                    ${m.player2}${p2Win ? '<i class="fa-solid fa-crown text-amber-400 ml-1 text-[10px]"></i>' : ''}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                                <span>Popola da Gironi</span>
                            </button>
                        ` : ''}
                    </div>

                    ${champion ? `
                        <div class="bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-500 text-slate-900 p-4 rounded-2xl shadow-md text-center space-y-1">
                            <div class="text-[10px] font-extrabold uppercase tracking-widest">Campione del Torneo</div>
                            <div class="text-lg font-black flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-trophy"></i>
                                <span>${champion}</span>

                    <!-- Finalissima -->
                    <div class="space-y-2">

                            ${Object.entries(THEME_PALETTES).map(([key, pal]) => `
                                <button type="button" onclick="setPresetTheme('${key}')" class="p-2 rounded-xl border ${appState.themeKey === key ? 'border-slate-900 ring-2 ring-slate-900/10 bg-slate-50' : 'border-slate-200 hover:border-slate-300'} flex items-center space-x-2 transition">
                                    <span class="w-4 h-4 rounded-full shrink-0 shadow-2xs" style="background-color: ${pal[600]}"></span>
                                    <span class="text-[10px] font-bold text-slate-700 truncate">${pal.name.split(' ')[0]}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="text-xs font-bold text-slate-700">Colore Personalizzato</span>
                            <input type="color" value="${appState.customThemeHex || '#0284c7'}" onchange="setCustomThemeColor(this.value)" class="w-9 h-7 rounded cursor-pointer border-0 bg-transparent">
                        </div>
                    </div>

                    <!-- Configura Nuovo Torneo -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                        <h3 class="font-extrabold text-sm text-slate-800 flex items-center space-x-2">
                            <i class="fa-solid fa-gear text-tennis-600"></i>
                            <span>Crea / Configura Torneo</span>
                        </h3>
                        <form onsubmit="generateNewTournamentStructure(event)" class="space-y-3.5">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Nome Torneo</label>
                                <input type="text" id="admin-tournament-name" value="${appState.tournamentName}" class="w-full text-xs p-3 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-tennis-500" required>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Numero Giocatori</label>
                                    <select id="admin-num-players" class="w-full text-xs p-3 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-tennis-500">
                                        <option value="8" ${appState.players.length === 8 ? 'selected' : ''}>8 Giocatori</option>
                                        <option value="12" ${appState.players.length === 12 ? 'selected' : ''}>12 Giocatori</option>
                                        <option value="16" ${appState.players.length === 16 ? 'selected' : ''}>16 Giocatori</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Numero Gironi</label>
                                    <select id="admin-num-groups" class="w-full text-xs p-3 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-tennis-500">
                                        <option value="2">2 Gironi (A, B)</option>
                                        <option value="4">4 Gironi (A, B, C, D)</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-tennis-600 hover:bg-tennis-700 text-white font-bold text-xs py-3 rounded-xl shadow transition">
                                Genera Gironi e Calendario
                            </button>
                        </form>
                    </div>

                    <!-- Gestione Giocatori Partecipanti (Solo Amministratore) -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-extrabold text-sm text-slate-800 flex items-center space-x-2">
                                <i class="fa-solid fa-users-gear text-tennis-600"></i>
                                <span>Giocatori Partecipanti</span>
                            </h3>
                            <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-lg flex items-center space-x-1">
                                <i class="fa-solid fa-user-shield"></i>
                                <span>Solo Admin</span>
                            </span>
                        </div>
                        <p class="text-xs text-slate-500 leading-relaxed">
                            Modifica direttamente i nomi dei partecipanti (verranno aggiornati automaticamente in classifiche, calendario e tabellone) oppure aggiungi un nuovo giocatore.
                        </p>

                        <!-- Aggiungi Nuovo Giocatore -->
                        <form onsubmit="addNewPlayerAdmin(event)" class="flex gap-2">
                            <input type="text" id="admin-new-player-name" placeholder="Nome e Cognome..." class="flex-1 min-w-0 text-xs p-2.5 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-tennis-500" required>
                            <select id="admin-new-player-group" class="text-xs p-2.5 rounded-xl border border-slate-200 font-bold text-slate-700 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-tennis-500">
                                ${[...new Set([...appState.players.map(p => p.group), 'A', 'B', 'C', 'D'])].sort().map(g => `<option value="${g}">Gir. ${g}</option>`).join('')}
                            </select>
                            <button type="submit" class="bg-tennis-600 hover:bg-tennis-700 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl shadow transition shrink-0" title="Aggiungi giocatore">
                                <i class="fa-solid fa-user-plus"></i>
                            </button>
                        </form>

                        <!-- Lista Giocatori Modificabili -->
                        <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
                            ${appState.players.map(p => `
                                <div class="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl border border-slate-200/80">
                                    <span class="w-7 h-7 rounded-lg bg-tennis-100 text-tennis-800 font-extrabold text-[11px] flex items-center justify-center shrink-0">
                                        ${p.group}
                                    </span>
                                    <input type="text" value="${p.name.replace(/"/g, '&quot;')}" onchange="updatePlayerName(${p.id}, this.value)" class="flex-1 min-w-0 text-xs font-bold text-slate-800 bg-white px-2.5 py-1.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-tennis-500" placeholder="Nome giocatore">
                                    <button type="button" onclick="removePlayerAdmin(${p.id})" class="text-rose-500 hover:text-rose-700 hover:bg-rose-50 w-7 h-7 rounded-lg flex items-center justify-center transition shrink-0" title="Rimuovi giocatore">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Gestione Password Ruoli con pulsante visibilità password (occhio) -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                        <h3 class="font-extrabold text-sm text-slate-800 flex items-center space-x-2">
                            <i class="fa-solid fa-key text-tennis-600"></i>
                            <span>Modifica Password Ruoli</span>
                        </h3>
                        <form onsubmit="updateRolePasswords(event)" class="space-y-3.5">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Nuova Password Editore</label>
                                <div class="relative">
                                    <input type="password" id="new-edit-pwd" value="${appState.passwords.editore}" class="w-full text-xs p-3 pr-10 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-tennis-500" required>
                                    <button type="button" onclick="toggleAdminPwdVisibility('new-edit-pwd', 'admin-edit-eye')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                        <i id="admin-edit-eye" class="fa-solid fa-eye text-xs"></i>
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Nuova Password Amministratore</label>
                                <div class="relative">
                                    <input type="password" id="new-admin-pwd" value="${appState.passwords.amministratore}" class="w-full text-xs p-3 pr-10 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-tennis-500" required>
                                    <button type="button" onclick="toggleAdminPwdVisibility('new-admin-pwd', 'admin-admin-eye')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                        <i id="admin-admin-eye" class="fa-solid fa-eye text-xs"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs py-3 rounded-xl shadow transition">
                                Salva Nuove Password
                            </button>
                        </form>
                    </div>

                    <!-- Modifica Regolamento & Crediti -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                        <h3 class="font-extrabold text-sm text-slate-800 flex items-center space-x-2">
                            <i class="fa-solid fa-file-pen text-tennis-600"></i>
                            <span>Modifica Regolamento & Crediti</span>
                        </h3>
                        <form onsubmit="saveRules(event)" class="space-y-3.5">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Testo Regolamento</label>
                                <textarea id="admin-rules-textarea" rows="5" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-tennis-500 leading-relaxed">${appState.rulesText}</textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Autore / Sviluppatore</label>
                                <input type="text" id="admin-author-input" value="${appState.authorText || 'Realizzato da Antonio Esposito'}" class="w-full text-xs p-3 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-tennis-500" required>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Testo Copyright</label>
                                <input type="text" id="admin-copyright-input" value="${appState.copyrightText || '© 2026 Open Tennis Cup. Tutti i diritti riservati.'}" class="w-full text-xs p-3 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-tennis-500" required>
                            </div>
                            <button type="submit" class="w-full bg-tennis-600 hover:bg-tennis-700 text-white font-bold text-xs py-3 rounded-xl shadow transition">
                                Salva Regolamento e Crediti
                            </button>
                        </form>
                    </div>

                    <!-- Reset Dati -->
                    <div class="bg-rose-50 border border-rose-200 p-5 rounded-2xl space-y-3">
                        <h3 class="font-extrabold text-sm text-rose-900">Ripristina Dati Iniziali</h3>
                        <p class="text-xs text-rose-700 leading-relaxed">Riporta il torneo ai dati dimostrativi originali.</p>
                        <button onclick="resetToDemoData()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs py-3 rounded-xl shadow transition">
                            Ripristina Demo
                        </button>
                    </div>
                </div>
            `;
        }

        // Pull-to-Refresh Mobile Gesture Handler
        function initPullToRefresh() {
            const mainEl = document.getElementById('main-content');
            const ptrIndicator = document.getElementById('ptr-indicator');
            const ptrIcon = document.getElementById('ptr-icon');
            if (!mainEl || !ptrIndicator || !ptrIcon) return;

            let startY = 0;
            let currentPull = 0;
            let isPulling = false;
            let isRefreshing = false;
            const threshold = 75;

            mainEl.addEventListener('touchstart', (e) => {
                if (isRefreshing) return;
                if (mainEl.scrollTop <= 0 && e.touches.length === 1) {
                    startY = e.touches[0].clientY;
                    isPulling = true;
                    currentPull = 0;
                }
            }, { passive: true });

            mainEl.addEventListener('touchmove', (e) => {
                if (!isPulling || isRefreshing) return;
                if (mainEl.scrollTop > 0) {
                    isPulling = false;
                    ptrIndicator.style.opacity = '0';
                    return;
                }

                const dy = e.touches[0].clientY - startY;
                if (dy > 10) {
                    currentPull = Math.min(dy * 0.5, 110);
                    ptrIndicator.style.opacity = Math.min(currentPull / 50, 1).toString();
                    ptrIndicator.style.transform = `translate(-50%, ${currentPull * 0.45}px)`;

                    if (currentPull >= threshold) {
                        ptrIcon.className = 'fa-solid fa-rotate-right text-sm text-tennis-600';
                        ptrIcon.style.transform = 'rotate(180deg)';
                    } else {
                        ptrIcon.className = 'fa-solid fa-arrow-down text-sm text-slate-500';
                        ptrIcon.style.transform = `rotate(${(currentPull / threshold) * 180}deg)`;
                    }
                }
            }, { passive: true });

            mainEl.addEventListener('touchend', async () => {
                if (!isPulling || isRefreshing) return;
                isPulling = false;

                if (currentPull >= threshold) {
                    isRefreshing = true;
                    ptrIndicator.style.opacity = '1';
                    ptrIndicator.style.transform = 'translate(-50%, 24px)';
                    ptrIcon.className = 'fa-solid fa-arrows-rotate fa-spin text-sm text-tennis-600';

                    if (appState.cloudSyncUrl) {
                        await pullStateFromCloud(false);
                    } else {
                        loadFromStorage();
                        renderApp();
                        showToast('Schermata aggiornata!', 'success');
                    }

                    setTimeout(() => {
                        ptrIndicator.style.opacity = '0';
                        ptrIndicator.style.transform = 'translate(-50%, 0px)';
                        ptrIcon.className = 'fa-solid fa-arrow-down text-sm';
                        ptrIcon.style.transform = 'rotate(0deg)';
                        isRefreshing = false;
                    }, 400);
                } else {
                    ptrIndicator.style.opacity = '0';
                    ptrIndicator.style.transform = 'translate(-50%, 0px)';
                }
                currentPull = 0;
            }, { passive: true });
        }

        // Initialize on Load
        window.onload = function () {
            loadFromStorage();
            checkCloudUrlFromQuery();
            initPWA();
            initPullToRefresh();
            renderApp();
            startCloudPolling();
        };
    </script>
</body>
</html>
